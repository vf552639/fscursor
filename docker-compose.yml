name: fs-cursor
services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - "6479:6379"
    networks: [app-net]

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8100:8000"
    depends_on:
      redis:
        condition: service_started
    networks: [app-net]

  worker:
    build: ./backend
    entrypoint: []
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks: [app-net]

  beat:
    build: ./backend
    entrypoint: []
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks: [app-net]

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3100:5173"
    networks: [app-net]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      WEB_CSP_CONNECT_SRC: ${WEB_CSP_CONNECT_SRC:-http://localhost:8100}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "WEB_CSP_CONNECT_SRC"
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks: [app-net]

volumes:
  redis_data:

networks:
  app-net:
    driver: bridge
