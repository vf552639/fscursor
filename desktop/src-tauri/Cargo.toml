[package]
name = "sdmp-desktop"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sdmp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
# Нативные диалоги «да/нет». Не украшение: webview на macOS рисует JS-диалоги
# (`alert`/`confirm`/`prompt`) только если UI-делегат реализует
# `runJavaScriptConfirmPanelWithMessage:…`, а делегат wry (0.55) не реализует ни
# одного JS-панельного метода — WKWebView в этом случае панель не показывает и
# отдаёт `false`. То есть `window.confirm` в десктопе всегда «нет» без вопроса:
# отсюда и не принимался SSH-ключ, и молча не срабатывали все кнопки удаления.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"

# Crypto and storage (used in Stage 2; pin now to keep workspace consistent)
dryoc = "0.6"
# ВНИМАНИЕ: `keyring` объявлен ПО ПЛАТФОРМАМ ниже, а не здесь. У этого крейта
# хранилище включается фичей, и `keyring = "3"` без фич собирается с mock-стором:
# `set_password` возвращает `Ok(())`, ничего не сохранив, а `get_password` всегда
# отвечает `NoEntry`. Ровно это и было: мастер-ключ «сохранялся» при логине,
# `load_master_key` возвращал `None`, и любая запись секрета падала на
# `keychain: locked` — то есть путь записи секретов не работал вовсе.
# Не переносить обратно в общую секцию без фич.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
tiny-bip39 = "1"
zeroize = { version = "1.8", features = ["derive"] }

# SSH and HTTP (used in Stage 3)
russh = "0.45"
russh-keys = "0.45"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
quick-xml = { version = "0.36", features = ["serialize"] }
roxmltree = "0.20"
shell-escape = "0.1"
async-trait = "0.1"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
http = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Хранилище мастер-ключа — по одному backend'у на платформу (см. комментарий у
# `dryoc`). macOS — Keychain Services, Windows — Credential Manager, Linux —
# Secret Service (`crypto-rust`, чтобы не тянуть системный OpenSSL).
# `linux-native` (keyutils) намеренно НЕ берём: он живёт до перезагрузки, а
# мастер-ключ обязан её переживать — иначе пользователь теряет доступ к своим
# секретам после ребута.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
default = []
ssh_integration = []

[[test]]
name = "ssh_integration"
path = "tests/ssh_integration.rs"
required-features = ["ssh_integration"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
