[package]
name = "sdmp-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sdmp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"

# Crypto and storage (used in Stage 2; pin now to keep workspace consistent)
dryoc = "0.6"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
tiny-bip39 = "1"
zeroize = { version = "1.8", features = ["derive"] }

# SSH and HTTP (used in Stage 3)
russh = "0.45"
russh-keys = "0.45"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
quick-xml = { version = "0.36", features = ["serialize"] }
roxmltree = "0.20"
shell-escape = "0.1"
async-trait = "0.1"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
http = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
ssh_integration = []

[[test]]
name = "ssh_integration"
path = "tests/ssh_integration.rs"
required-features = ["ssh_integration"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
